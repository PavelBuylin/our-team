name: Check index.html and Update README

on:
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run check_index.sh
        id: check
        run: |
          chmod +x check_index.sh
          if bash check_index.sh; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main branch
        if: steps.check.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update README.md in main
        if: steps.check.outputs.exists == 'true'
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          LINE="| \`${BRANCH_NAME}\` | index.html exists | ✅ |"
          
          if ! grep -q "| Branch |" README.md 2>/dev/null; then
            echo "" >> README.md
            echo "## Branch Check Results" >> README.md
            echo "" >> README.md
            echo "| Branch | Status | Result |" >> README.md
            echo "|--------|--------|--------|" >> README.md
          fi
          
          echo "$LINE" >> README.md

      - name: Commit and push to main
        if: steps.check.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "✅ Branch ${{ github.ref_name }}: index.html exists"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Exit if index.html not found
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "index.html not found in branch ${{ github.ref_name }}. No changes made."
